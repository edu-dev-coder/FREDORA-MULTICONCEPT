kind = "web"
previewPath = "/web/"
title = "Fredora TemperaMap Web"
version = "1.0.0"
id = "artifacts/fredora-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/web/" ]
localPort = 26111

[services.development]
run = "pnpm --filter @workspace/fredora-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fredora-web", "run", "build" ]
publicDir = "artifacts/fredora-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26111"
BASE_PATH = "/web/"
