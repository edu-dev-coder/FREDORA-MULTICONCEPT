kind = "web"
previewPath = "/admin/"
title = "Fredora Admin Panel"
version = "1.0.0"
id = "artifacts/fredora-admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/admin/" ]
localPort = 26126

[services.development]
run = "pnpm --filter @workspace/fredora-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fredora-admin", "run", "build" ]
publicDir = "artifacts/fredora-admin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26126"
BASE_PATH = "/admin/"
